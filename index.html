<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="bg-white font-sans text-ios-label antialiased">

    <nav class="flex flex-col gap-3" aria-label="템플릿 목록">
      <a href="./templates/v1-letter.html" class="flex min-h-touch items-center gap-4 rounded-[20px] bg-white p-4 shadow-sm ring-1 ring-black/5 transition-transform duration-200 active:scale-[0.98]">

      </a>

      <a href="./templates/v2-collage.html" class="flex min-h-touch items-center gap-4 rounded-[20px] bg-white p-4 shadow-sm ring-1 ring-black/5 transition-transform duration-200 active:scale-[0.98]">
        <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-[14px] bg-[#3A3A3C] text-[15px] font-bold text-white">02</span>
